# SwiftLint configuration for Emailer clients

included:
  - shared/Sources
  - shared/Tests
  - macos/Sources
  - macos/Tests
  - ios/Sources

excluded:
  - .build
  - Packages

# Rules
disabled_rules:
  - trailing_comma
  - opening_brace
  - todo

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - discouraged_object_literal
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - implicit_return
  - joined_default_parameter
  - last_where
  - modifier_order
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

# Configuration
line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 100

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    - id
    - to
    - cc
    - x
    - y
    - i

nesting:
  type_level: 3
  function_level: 3

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60
